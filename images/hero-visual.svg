<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="burgundyGrad" x1="0" y1="0" x2="740" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A1215"/>
      <stop offset="100%" stop-color="#300A0C"/>
    </linearGradient>
    <linearGradient id="peachAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED7B8"/>
      <stop offset="100%" stop-color="#FCD0AC"/>
    </linearGradient>
    <linearGradient id="glassBurgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softBurgundyShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#300A0C" flood-opacity="0.22"/>
    </filter>
    <filter id="badgeShadowBurgundy" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#300A0C" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Outer Architectural Grid Backing -->
  <g opacity="0.3">
    <circle cx="370" cy="300" r="280" stroke="#FED7B8" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="370" cy="300" r="200" stroke="#EBDDD5" stroke-width="1"/>
    <path d="M 90 300 L 650 300 M 370 20 L 370 580" stroke="#EBDDD5" stroke-width="1" stroke-dasharray="3 5"/>
  </g>

  <!-- Ambient Decorative Peach Dots -->
  <circle cx="80" cy="110" r="3.5" fill="#FED7B8"/>
  <circle cx="660" cy="140" r="4.5" fill="#FED7B8"/>
  <circle cx="680" cy="480" r="3" fill="#FED7B8"/>
  <circle cx="100" cy="490" r="4" fill="#FED7B8"/>

  <!-- Main Code Editor Container -->
  <g filter="url(#softBurgundyShadow)">
    <rect x="70" y="50" width="600" height="480" rx="16" fill="url(#burgundyGrad)" stroke="#6B1D22" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <rect x="70" y="50" width="600" height="48" rx="16" fill="#380C0F"/>
    <path d="M 70 82 L 70 98 L 670 98 L 670 82 Z" fill="#380C0F"/>
    <line x1="70" y1="98" x2="670" y2="98" stroke="#521418" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="102" cy="74" r="6" fill="#E06C75" opacity="0.9"/>
    <circle cx="122" cy="74" r="6" fill="#FED7B8" opacity="0.9"/>
    <circle cx="142" cy="74" r="6" fill="#98C379" opacity="0.9"/>

    <!-- Editor Tabs -->
    <rect x="180" y="60" width="145" height="38" rx="6" fill="#4A1215" stroke="#6B1D22" stroke-width="1"/>
    <circle cx="198" cy="79" r="4" fill="#FED7B8"/>
    <text x="212" y="83" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#FFF9F5">portfolio.html</text>

    <rect x="335" y="62" width="120" height="34" rx="6" fill="transparent"/>
    <text x="350" y="83" font-family="'DM Sans', sans-serif" font-size="12" font-weight="400" fill="#A88B8E">style.css</text>

    <rect x="465" y="62" width="110" height="34" rx="6" fill="transparent"/>
    <text x="480" y="83" font-family="'DM Sans', sans-serif" font-size="12" font-weight="400" fill="#A88B8E">script.js</text>

    <!-- Status indicator badge on right of window header -->
    <rect x="585" y="66" width="68" height="22" rx="11" fill="#521418"/>
    <circle cx="597" cy="77" r="3.5" fill="#FED7B8"/>
    <text x="606" y="81" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#FED7B8">ONLINE</text>

    <!-- Sidebar / Line Numbers Area -->
    <rect x="71" y="99" width="48" height="430" fill="#2E0A0C" rx="0 0 0 16"/>
    <line x1="119" y1="99" x2="119" y2="529" stroke="#521418" stroke-width="1"/>

    <!-- Line Numbers -->
    <text x="96" y="132" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">01</text>
    <text x="96" y="160" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">02</text>
    <text x="96" y="188" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">03</text>
    <text x="96" y="216" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">04</text>
    <text x="96" y="244" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">05</text>
    <text x="96" y="272" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">06</text>
    <text x="96" y="300" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">07</text>
    <text x="96" y="328" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">08</text>
    <text x="96" y="356" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">09</text>
    <text x="96" y="384" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">10</text>
    <text x="96" y="412" font-family="'DM Sans', monospace" font-size="11" fill="#75474A" text-anchor="middle">11</text>

    <!-- Code Block with Burgundy & Soft Peach Accents -->
    <text x="140" y="132" font-family="'DM Sans', monospace" font-size="12" fill="#B38E91" font-style="italic">
      /* Umama Maya — Burgundy &amp; Peach Portfolio */
    </text>

    <text x="140" y="160" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#FCA5A5">const</tspan>
      <tspan fill="#FED7B8"> developer</tspan>
      <tspan fill="#E5E7EB"> = {</tspan>
    </text>

    <text x="164" y="188" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#E5E7EB">name:</tspan>
      <tspan fill="#FED7B8"> "Umama Maya"</tspan><tspan fill="#E5E7EB">,</tspan>
    </text>

    <text x="164" y="216" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#E5E7EB">roles:</tspan>
      <tspan fill="#E5E7EB"> [</tspan><tspan fill="#FED7B8">"Web Developer"</tspan><tspan fill="#E5E7EB">, </tspan><tspan fill="#FED7B8">"WordPress"</tspan><tspan fill="#E5E7EB">, </tspan><tspan fill="#FED7B8">"Front-End"</tspan><tspan fill="#E5E7EB">],</tspan>
    </text>

    <text x="164" y="244" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#E5E7EB">stack:</tspan>
      <tspan fill="#E5E7EB"> [</tspan><tspan fill="#FED7B8">"HTML5"</tspan><tspan fill="#E5E7EB">, </tspan><tspan fill="#FED7B8">"CSS3"</tspan><tspan fill="#E5E7EB">, </tspan><tspan fill="#FED7B8">"JavaScript"</tspan><tspan fill="#E5E7EB">, </tspan><tspan fill="#FED7B8">"PHP"</tspan><tspan fill="#E5E7EB">],</tspan>
    </text>

    <text x="164" y="272" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#E5E7EB">palette:</tspan>
      <tspan fill="#FED7B8"> "Burgundy &amp; Soft Peach"</tspan><tspan fill="#E5E7EB">,</tspan>
    </text>

    <text x="164" y="300" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#E5E7EB">availableForHire:</tspan>
      <tspan fill="#FED7B8"> true</tspan>
    </text>

    <text x="140" y="328" font-family="'DM Sans', monospace" font-size="12" fill="#E5E7EB">};</text>

    <text x="140" y="356" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#FCA5A5">async function</tspan>
      <tspan fill="#FED7B8"> createExperience</tspan><tspan fill="#E5E7EB">() {</tspan>
    </text>

    <text x="164" y="384" font-family="'DM Sans', monospace" font-size="12">
      <tspan fill="#FCA5A5">return await</tspan>
      <tspan fill="#FED7B8"> craftBespokeWebsites</tspan><tspan fill="#E5E7EB">();</tspan>
    </text>

    <text x="140" y="412" font-family="'DM Sans', monospace" font-size="12" fill="#E5E7EB">}</text>
  </g>

  <!-- Floating Feature Card 1: 100% Responsive Architecture (Top Right) -->
  <g filter="url(#badgeShadowBurgundy)">
    <rect x="470" y="110" width="225" height="74" rx="12" fill="#3D0F12" stroke="#FED7B8" stroke-width="1.5"/>
    <circle cx="500" cy="147" r="16" fill="#59171B"/>
    <rect x="494" y="139" width="12" height="16" rx="2" fill="none" stroke="#FED7B8" stroke-width="1.5"/>
    <line x1="498" y1="152" x2="502" y2="152" stroke="#FED7B8" stroke-width="1.5"/>
    <text x="526" y="141" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#FFF9F5">100% Responsive</text>
    <text x="526" y="157" font-family="'DM Sans', sans-serif" font-size="11" font-weight="400" fill="#FED7B8">Desktop • Tablet • Mobile</text>
  </g>

  <!-- Floating Feature Card 2: Clean Semantic Code (Bottom Left) -->
  <g filter="url(#badgeShadowBurgundy)">
    <rect x="40" y="380" width="235" height="80" rx="12" fill="#3D0F12" stroke="#6B1D22" stroke-width="1.5"/>
    <circle cx="72" cy="420" r="16" fill="#59171B"/>
    <path d="M 69 414 L 64 420 L 69 426 M 75 414 L 80 420 L 75 426" stroke="#FED7B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="413" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#FFF9F5">Clean Code Craft</text>
    <text x="98" y="430" font-family="'DM Sans', sans-serif" font-size="11" font-weight="400" fill="#D4B5B8">Accessible &amp; Semantic</text>
  </g>

  <!-- Floating Feature Card 3: WordPress & CMS Specialist (Bottom Right) -->
  <g filter="url(#badgeShadowBurgundy)">
    <rect x="430" y="440" width="260" height="74" rx="12" fill="#3D0F12" stroke="#FED7B8" stroke-width="1.5"/>
    <circle cx="462" cy="477" r="16" fill="#59171B"/>
    <path d="M 462 469 L 464.5 474.5 L 470 475 L 466 479 L 467 485 L 462 482 L 457 485 L 458 479 L 454 475 L 459.5 474.5 Z" fill="#FED7B8"/>
    <text x="490" y="471" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#FFF9F5">WordPress &amp; Elementor</text>
    <text x="490" y="488" font-family="'DM Sans', sans-serif" font-size="11" font-weight="400" fill="#FED7B8">Custom Pages &amp; CMS</text>
  </g>
</svg>
